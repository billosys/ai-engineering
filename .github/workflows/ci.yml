name: CI

# Run the build-time checks on every push to main (covers direct pushes and
# merge commits) and on every pull request targeting main (so the checks gate
# a PR before it is merged).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref cancels an in-flight run for that ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build skill bundles
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install skill tooling dependencies
        run: python -m pip install -r scripts/requirements-skill-tools.txt

      - name: Test skill description tooling
        run: make test-skill-tools

      # Fast, explicit signal: every SKILL.md description within the limit.
      - name: Validate skill descriptions
        run: make check-skills

      # Full packaging: builds every per-domain bundle and the
      # collaboration-framework bundle, re-running the per-bundle guards and
      # catching missing files or staging errors.
      - name: Test the skill version gate
        run: make test-skill-versions

      - name: Build and validate skill bundles
        run: make check-package-paths
