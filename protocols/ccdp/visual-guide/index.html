document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ showProgressRail }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"position: fixed; right: 22px; top: 50%; transform: translateY(-50%); z-index: 50; display: flex; flex-direction: column; align-items: center; gap: 8px;\">\n  <sc-for list=\"{{ navDots }}\" as=\"d\" hint-placeholder-count=\"19\">\n    <div sc-camel-on-click=\"{{ d.go }}\" title=\"{{ d.label }}\" style=\"width: 9px; height: 9px; border-radius: 50%; cursor: pointer; background: {{ d.bg }}; border: 1px solid {{ d.bd }}; transition: background .25s, border-color .25s;\"><\u002Fdiv>\n  <\u002Fsc-for>\n  <div style=\"margin-top: 6px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10px; color: #8A8378; letter-spacing: .08em;\">{{ counter }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ 1 · HERO ============ -->\n<section data-view=\"0\" data-screen-label=\"Hero\" style=\"max-width: 900px; margin: 0 auto; padding: 120px 48px 88px; text-align: center;\">\n  <div data-reveal=\"\" style=\"font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; letter-spacing: .22em; color: #6D5A9E; text-transform: uppercase;\">Composite Cognition Dispatch Protocol<\u002Fdiv>\n  <h1 data-reveal=\"\" style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 58px; line-height: 1.12; margin: 26px auto 0; max-width: 780px; text-wrap: balance;\">A protocol that routes cognitive work to the right tool for the job — and stamps every answer with how much you should trust it.<\u002Fh1>\n  <div data-reveal=\"\" style=\"margin: 44px auto 0; max-width: 340px;\">\n    <svg sc-camel-view-box=\"0 0 320 210\" style=\"width: 100%; display: block;\" aria-hidden=\"true\">\n      <line x1=\"160\" y1=\"44\" x2=\"160\" y2=\"96\" stroke=\"#D8D2C6\" stroke-width=\"1.5\"><\u002Fline>\n      <line x1=\"160\" y1=\"126\" x2=\"48\" y2=\"180\" stroke=\"#D8D2C6\" stroke-width=\"1.5\"><\u002Fline>\n      <line x1=\"160\" y1=\"126\" x2=\"104\" y2=\"180\" stroke=\"#D8D2C6\" stroke-width=\"1.5\"><\u002Fline>\n      <line x1=\"160\" y1=\"126\" x2=\"160\" y2=\"180\" stroke=\"#D8D2C6\" stroke-width=\"1.5\"><\u002Fline>\n      <line x1=\"160\" y1=\"126\" x2=\"216\" y2=\"180\" stroke=\"#D8D2C6\" stroke-width=\"1.5\"><\u002Fline>\n      <line x1=\"160\" y1=\"126\" x2=\"272\" y2=\"180\" stroke=\"#D8D2C6\" stroke-width=\"1.5\"><\u002Fline>\n      <circle cx=\"160\" cy=\"111\" r=\"26\" fill=\"#E4EBF3\" style=\"transform-origin: 160px 111px; animation: ccdpPulse 3.2s ease-in-out infinite;\"><\u002Fcircle>\n      <circle cx=\"160\" cy=\"111\" r=\"15\" fill=\"#35597F\"><\u002Fcircle>\n      <circle cx=\"160\" cy=\"32\" r=\"11\" fill=\"#C05C46\"><\u002Fcircle>\n      <circle cx=\"48\" cy=\"186\" r=\"8\" fill=\"#A79C8C\"><\u002Fcircle>\n      <circle cx=\"104\" cy=\"186\" r=\"8\" fill=\"#2A7B6C\"><\u002Fcircle>\n      <circle cx=\"160\" cy=\"186\" r=\"8\" fill=\"#2A7B6C\"><\u002Fcircle>\n      <circle cx=\"216\" cy=\"186\" r=\"8\" fill=\"#C05C46\"><\u002Fcircle>\n      <circle cx=\"272\" cy=\"186\" r=\"8\" fill=\"#2A7B6C\"><\u002Fcircle>\n    <\u002Fsvg>\n  <\u002Fdiv>\n  <p data-reveal=\"\" style=\"font-size: 19px; line-height: 1.7; color: #55503F; max-width: 720px; margin: 40px auto 0; text-align: left; text-wrap: pretty;\">When you ask an LLM a question, it does everything itself — drafts, reasons, calculates, checks — and you get one answer with no way to tell which parts are rock-solid and which are educated guesses. CCDP splits that work up: a central Dispatcher reads the envelope (never the content), routes each piece to a specialist — a theorem prover, a planner, a database, an LLM, a human reviewer — and every answer comes back with a provenance grade saying exactly how strong the evidence behind it is. If a piece can't meet the quality bar, it escalates up the chain instead of quietly getting it wrong.<\u002Fp>\n<\u002Fsection>\n\n<!-- ============ 2 · CORE PROBLEM ============ -->\n<section data-view=\"1\" data-screen-label=\"The Core Problem\" style=\"max-width: 960px; margin: 0 auto; padding: 88px 48px; border-top: 1px solid #E3DDD2;\">\n  <div data-reveal=\"\" style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .2em; color: #8A8378; text-transform: uppercase;\">View 02 · Why this exists<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 42px; margin: 14px 0 10px;\">Two things that look the same — and aren't<\u002Fh2>\n  <div data-reveal=\"\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 34px;\">\n    <div style=\"background: #FDFCF9; border: 1px solid #E3DDD2; border-radius: 10px; padding: 26px 28px; box-shadow: 0 1px 3px rgba(35,32,26,.05);\">\n      <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .16em; color: #35597F; text-transform: uppercase; margin-bottom: 14px;\">Data<\u002Fdiv>\n      <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 13.5px; background: #F1EEE7; border: 1px solid #E3DDD2; border-radius: 6px; padding: 12px 14px; color: #44403A;\">row 4182 · balance: $12,904.22<\u002Fdiv>\n      <p style=\"margin: 16px 0 0; color: #6E675C; font-size: 15.5px;\">A database row is what it is. Its correctness is a property of the system that stores it.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background: #FDFCF9; border: 1px solid #E3DDD2; border-radius: 10px; padding: 26px 28px; box-shadow: 0 1px 3px rgba(35,32,26,.05);\">\n      <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .16em; color: #A64B37; text-transform: uppercase; margin-bottom: 14px;\">A claim<\u002Fdiv>\n      <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 13.5px; background: #F8E7E0; border: 1px solid #E5C0B4; border-radius: 6px; padding: 12px 14px; color: #7A3A2C;\">“The clause is enforceable.” — an LLM<\u002Fdiv>\n      <p style=\"margin: 16px 0 0; color: #6E675C; font-size: 15.5px;\">An LLM assertion has an epistemic status — backed by evidence, or not. On the surface it looks just like data.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-reveal=\"\" style=\"margin-top: 30px; background: #ECE7F4; border: 1px solid #D5CCE6; border-radius: 10px; padding: 22px 28px;\">\n    <p style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 24px; font-weight: 600; color: #4A3A70; line-height: 1.4;\">Cognitive outputs are claims with epistemic status, not just data — and a protocol that carries that distinction lets you build reliable systems from unreliable parts.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 3 · COMPONENT DIAGRAM ============ -->\n<section data-view=\"2\" data-screen-label=\"Component Diagram\" style=\"max-width: 1000px; margin: 0 auto; padding: 88px 48px; border-top: 1px solid #E3DDD2;\">\n  <div data-reveal=\"\" style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .2em; color: #8A8378; text-transform: uppercase;\">View 03 · The star topology<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 42px; margin: 14px 0 6px;\">Every message passes through the center<\u002Fh2>\n  <p data-reveal=\"\" style=\"color: #6E675C; max-width: 640px; margin: 0 0 34px;\">Click any component to see its role. No direct service-to-service links — N links, not N(N−1)/2, and a single point of protocol enforcement.<\u002Fp>\n  <div data-reveal=\"\" style=\"display: flex; flex-direction: column; align-items: center; gap: 0;\">\n    <div sc-camel-on-click=\"{{ pickSupervisor }}\" style=\"cursor: pointer; background: #F8E7E0; border: 1.5px solid {{ supBorder }}; border-radius: 10px; padding: 12px 26px; text-align: center; box-shadow: 0 1px 3px rgba(35,32,26,.06);\" style-hover=\"border-color: #C05C46;\">\n      <div style=\"font-weight: 700; font-size: 16px; color: #7A3A2C;\">Human Supervisor<\u002Fdiv>\n      <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: #A64B37; letter-spacing: .08em;\">HUMAN_ATTESTED · the ceiling<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height: 44px; width: 1.5px; background: #D8D2C6; position: relative;\">\n      <div style=\"position: absolute; left: 12px; top: 12px; white-space: nowrap; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: #9A9081;\">escalation · oversight<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: center; gap: 0;\">\n      <div sc-camel-on-click=\"{{ pickDispatcher }}\" style=\"cursor: pointer; background: #E4EBF3; border: 1.5px solid {{ dispBorder }}; border-radius: 12px; padding: 18px 40px; text-align: center; box-shadow: 0 2px 8px rgba(53,89,127,.12);\" style-hover=\"border-color: #35597F;\">\n        <div style=\"font-weight: 700; font-size: 19px; color: #23405E;\">Dispatcher<\u002Fdiv>\n        <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: #35597F; letter-spacing: .08em;\">reads envelopes · never content<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width: 56px; height: 0; border-top: 1.5px dashed #D8D2C6;\"><\u002Fdiv>\n      <div sc-camel-on-click=\"{{ pickRegistry }}\" style=\"cursor: pointer; background: #FDFCF9; border: 1.5px solid {{ regBorder }}; border-radius: 10px; padding: 12px 20px; text-align: center;\" style-hover=\"border-color: #35597F;\">\n        <div style=\"font-weight: 700; font-size: 15px; color: #44403A;\">Capability Registry<\u002Fdiv>\n        <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: #8A8378;\">consulted every route<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <svg sc-camel-view-box=\"0 0 640 46\" style=\"width: 640px; max-width: 100%; display: block;\" aria-hidden=\"true\">\n      <line x1=\"320\" y1=\"0\" x2=\"64\" y2=\"46\" stroke=\"#D8D2C6\" stroke-width=\"1.5\"><\u002Fline>\n      <line x1=\"320\" y1=\"0\" x2=\"192\" y2=\"46\" stroke=\"#D8D2C6\" stroke-width=\"1.5\"><\u002Fline>\n      <line x1=\"320\" y1=\"0\" x2=\"320\" y2=\"46\" stroke=\"#D8D2C6\" stroke-width=\"1.5\"><\u002Fline>\n      <line x1=\"320\" y1=\"0\" x2=\"448\" y2=\"46\" stroke=\"#D8D2C6\" stroke-width=\"1.5\"><\u002Fline>\n      <line x1=\"320\" y1=\"0\" x2=\"576\" y2=\"46\" stroke=\"#D8D2C6\" stroke-width=\"1.5\"><\u002Fline>\n    <\u002Fsvg>\n    <div style=\"display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;\">\n      <sc-for list=\"{{ serviceChips }}\" as=\"s\" hint-placeholder-count=\"5\">\n        <div sc-camel-on-click=\"{{ s.go }}\" style=\"cursor: pointer; background: {{ s.bg }}; border: 1.5px solid {{ s.bd }}; border-radius: 9px; padding: 10px 16px; text-align: center; min-width: 88px;\" style-hover=\"filter: brightness(.97);\">\n          <div style=\"font-weight: 700; font-size: 14px; color: {{ s.fg }};\">{{ s.name }}<\u002Fdiv>\n          <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: {{ s.fg }}; opacity: .75;\">{{ s.mode }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-reveal=\"\" style=\"margin-top: 30px; background: #FDFCF9; border: 1px solid #E3DDD2; border-left: 4px solid {{ compAccent }}; border-radius: 8px; padding: 20px 26px; min-height: 96px;\">\n    <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: {{ compAccent }};\">{{ compName }}<\u002Fdiv>\n    <p style=\"margin: 8px 0 0; color: #44403A; font-size: 15.5px; line-height: 1.65;\">{{ compDesc }}<\u002Fp>\n  <\u002Fdiv>\n  <p data-reveal=\"\" style=\"margin-top: 18px; font-size: 14.5px; color: #6E675C;\"><span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; background: #E4EBF3; color: #23405E; border-radius: 4px; padding: 2px 7px;\">Key callout<\u002Fspan>&nbsp; The Dispatcher reads envelopes — the structured metadata — never content. It is deliberately not intelligent: a protocol enforcement engine, like a network switch that reads headers and forwards packets.<\u002Fp>\n<\u002Fsection>\n\n<!-- ============ 4 · PROTOCOL LAYERS ============ -->\n<section data-view=\"3\" data-screen-label=\"Protocol Layers\" style=\"max-width: 900px; margin: 0 auto; padding: 88px 48px; border-top: 1px solid #E3DDD2;\">\n  <div data-reveal=\"\" style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .2em; color: #8A8378; text-transform: uppercase;\">View 04 · The stack<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 42px; margin: 14px 0 6px;\">Four layers — one of them is new<\u002Fh2>\n  <p data-reveal=\"\" style=\"color: #6E675C; max-width: 640px; margin: 0 0 30px;\">Three layers have TCP/IP analogs. Layer 3 — the Epistemic layer — has none. Click a layer to inspect it.<\u002Fp>\n  <div data-reveal=\"\" style=\"display: flex; flex-direction: column; gap: 10px;\">\n    <sc-for list=\"{{ layers }}\" as=\"ly\" hint-placeholder-count=\"4\">\n      <div sc-camel-on-click=\"{{ ly.go }}\" style=\"cursor: pointer; background: {{ ly.bg }}; border: 1.5px solid {{ ly.bd }}; border-radius: 10px; padding: 16px 24px; box-shadow: {{ ly.shadow }}; transition: box-shadow .25s;\">\n        <div style=\"display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;\">\n          <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: {{ ly.fg }}; opacity: .8;\">Layer {{ ly.n }}<\u002Fdiv>\n          <div style=\"font-weight: 700; font-size: 18px; color: {{ ly.fg }};\">{{ ly.name }}<\u002Fdiv>\n          <div style=\"font-size: 13.5px; color: {{ ly.fg }}; opacity: .75; font-style: italic;\">{{ ly.analog }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ ly.open }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin: 10px 0 0; color: {{ ly.fg }}; font-size: 15px; line-height: 1.6;\">{{ ly.what }}<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <p data-reveal=\"\" style=\"margin-top: 22px; font-size: 14.5px; color: #6E675C;\"><span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; background: #ECE7F4; color: #4A3A70; border-radius: 4px; padding: 2px 7px;\">The novel layer<\u002Fspan>&nbsp; Layer 3 carries “how much should you trust this answer” as a first-class protocol field — provenance grades and evidence, escalation semantics, decomposition plans, cost and resource signals. No existing protocol has it.<\u002Fp>\n<\u002Fsection>\n\n<!-- ============ 5 · PROVENANCE LADDER ============ -->\n<section data-view=\"4\" data-screen-label=\"Provenance Grade Ladder\" style=\"max-width: 900px; margin: 0 auto; padding: 88px 48px; border-top: 1px solid #E3DDD2;\">\n  <div data-reveal=\"\" style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .2em; color: #8A8378; text-transform: uppercase;\">View 05 · The showpiece<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 42px; margin: 14px 0 6px;\">The provenance grade ladder<\u002Fh2>\n  <p data-reveal=\"\" style=\"color: #6E675C; max-width: 660px; margin: 0 0 30px;\">Eight grades, weakest to strongest. Every response carries one. Click a grade for its full definition.<\u002Fp>\n  <div data-reveal=\"\" style=\"display: flex; flex-direction: column; gap: 7px;\">\n    <sc-for list=\"{{ grades }}\" as=\"g\" hint-placeholder-count=\"8\">\n      <div sc-camel-on-click=\"{{ g.go }}\" style=\"cursor: pointer; display: grid; grid-template-columns: 116px 8px 1fr; gap: 0; background: #FDFCF9; border: 1px solid #E3DDD2; border-radius: 9px; overflow: hidden; box-shadow: 0 1px 2px rgba(35,32,26,.04);\" style-hover=\"border-color: #C9C2B4;\">\n        <div style=\"background: {{ g.bg }}; display: flex; flex-direction: column; justify-content: center; padding: 12px 14px; border-right: 1px solid {{ g.bd }};\">\n          <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: {{ g.fg }}; opacity: .75;\">Grade {{ g.n }}<\u002Fdiv>\n          <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: {{ g.fg }}; letter-spacing: .06em; text-transform: uppercase;\">{{ g.cat }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: {{ g.bar }};\"><\u002Fdiv>\n        <div style=\"padding: 12px 20px;\">\n          <div style=\"display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;\">\n            <span style=\"font-family: ui-monospace, Menlo, monospace; font-weight: 700; font-size: 14.5px; color: {{ g.fg }};\">{{ g.name }}<\u002Fspan>\n            <span style=\"font-size: 14.5px; color: #6E675C;\">{{ g.line }}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ g.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin: 8px 0 2px; font-size: 14.5px; color: #44403A; line-height: 1.6; max-width: 620px;\">{{ g.detail }}<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div data-reveal=\"\" style=\"margin-top: 26px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px;\">\n    <div style=\"background: #FDFCF9; border: 1px solid #E3DDD2; border-radius: 9px; padding: 16px 18px;\">\n      <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #8A8378;\">Sequential<\u002Fdiv>\n      <p style=\"margin: 7px 0 0; font-size: 13.5px; color: #44403A; line-height: 1.55;\">Weakest link. Chain A→B→C: composed grade = <span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 12px;\">min(A, B, C)<\u002Fspan>. The chain is only as strong as its weakest link.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background: #FDFCF9; border: 1px solid #E3DDD2; border-radius: 9px; padding: 16px 18px;\">\n      <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #2A7B6C;\">Parallel<\u002Fdiv>\n      <p style=\"margin: 7px 0 0; font-size: 13.5px; color: #44403A; line-height: 1.55;\">Cross-check upgrade. Independent services agree: composed grade can upgrade to <span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 12px;\">CROSS_CHECKED<\u002Fspan> if independence is confirmed.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background: #FDFCF9; border: 1px solid #E3DDD2; border-radius: 9px; padding: 16px 18px;\">\n      <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #6D5A9E;\">Decomposition<\u002Fdiv>\n      <p style=\"margin: 7px 0 0; font-size: 13.5px; color: #44403A; line-height: 1.55;\">Three factors: plan grade, sub-result grades, composition step grade. Composed = min of all three.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p data-reveal=\"\" style=\"margin-top: 20px; font-size: 14.5px; color: #6E675C;\"><span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; background: #F5EBD8; color: #7A5518; border-radius: 4px; padding: 2px 7px;\">Signaling theory<\u002Fspan>&nbsp; Each grade costs more to fake than the one below it (Spence). An LLM can cheaply assert anything — but a machine-checkable proof requires actual computation that can't be faked without doing the work.<\u002Fp>\n<\u002Fsection>\n\n<!-- ============ 6 · COMPARE INTRO ============ -->\n<section data-view=\"5\" data-screen-label=\"Compare Intro\" style=\"max-width: 780px; margin: 0 auto; padding: 100px 48px; border-top: 1px solid #E3DDD2; text-align: center;\">\n  <div data-reveal=\"\" style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .2em; color: #8A8378; text-transform: uppercase;\">Views 07–16 · Compare / Contrast<\u002Fdiv>\n  <p data-reveal=\"\" style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-size: 30px; font-weight: 500; line-height: 1.45; color: #44403A; margin: 22px 0 0; text-wrap: pretty;\">The following views trace through CCDP's big ideas in the order they appear in the specification. Each one shows the same request sent two ways — to a plain LLM on the left, and through a CCDP system on the right. The difference isn't that the LLM is bad. It's that the LLM alone can't tell you <em>which parts of its answer you can trust<\u002Fem> — and CCDP can.<\u002Fp>\n<\u002Fsection>\n\n<!-- ============ 7–16 · COMPARE VIEWS ============ -->\n<sc-for list=\"{{ compares }}\" as=\"c\" hint-placeholder-count=\"10\">\n  <section data-view=\"{{ c.view }}\" data-screen-label=\"{{ c.title }}\" style=\"max-width: 1000px; margin: 0 auto; padding: 80px 48px; border-top: 1px solid #E3DDD2;\">\n    <div data-reveal=\"\" style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .2em; color: #8A8378; text-transform: uppercase;\">View {{ c.num }} · {{ c.topic }}<\u002Fdiv>\n    <h2 data-reveal=\"\" style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 38px; margin: 12px 0 24px;\">{{ c.title }}<\u002Fh2>\n    <div data-reveal=\"\" style=\"background: #FDFCF9; border: 1px solid #E3DDD2; border-radius: 10px; padding: 18px 26px; box-shadow: 0 1px 3px rgba(35,32,26,.05); display: flex; gap: 16px; align-items: baseline;\">\n      <span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #35597F; flex-shrink: 0;\">{{ c.reqLabel }}<\u002Fspan>\n      <span style=\"font-size: 17px; color: #23201A; font-style: italic;\">“{{ c.request }}”<\u002Fspan>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;\">\n      <div style=\"background: #FDFCF9; border: 1px solid #E3DDD2; border-top: 3px solid #A79C8C; border-radius: 10px; padding: 22px 26px;\">\n        <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 14px;\">\n          <span style=\"width: 12px; height: 12px; border-radius: 50%; background: #A79C8C; flex-shrink: 0;\"><\u002Fspan>\n          <span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #6E6558;\">Plain LLM<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <sc-for list=\"{{ c.llm }}\" as=\"b\" hint-placeholder-count=\"3\">\n            <div style=\"display: flex; gap: 10px; font-size: 14.5px; color: #44403A; line-height: 1.55;\"><span style=\"color: #A79C8C; flex-shrink: 0;\">—<\u002Fspan><span>{{ b }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin: 16px 0 0; font-size: 14px; font-style: italic; color: #8A8378; line-height: 1.55;\">{{ c.lnote }}<\u002Fp>\n        <div style=\"margin-top: 16px;\"><span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; background: {{ c.lbg }}; color: {{ c.lfg }}; border: 1px solid {{ c.lbd }}; border-radius: 5px; padding: 4px 10px;\">{{ c.lbadge }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #FDFCF9; border: 1px solid #E3DDD2; border-top: 3px solid #35597F; border-radius: 10px; padding: 22px 26px;\">\n        <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 14px;\">\n          <span style=\"width: 12px; height: 12px; background: #35597F; transform: rotate(45deg); flex-shrink: 0;\"><\u002Fspan>\n          <span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #23405E;\">Through CCDP<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <sc-for list=\"{{ c.ccdp }}\" as=\"b\" hint-placeholder-count=\"4\">\n            <div style=\"display: flex; gap: 10px; font-size: 14.5px; color: #44403A; line-height: 1.55;\"><span style=\"color: #35597F; flex-shrink: 0;\">—<\u002Fspan><span>{{ b }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin: 16px 0 0; font-size: 14px; font-style: italic; color: #6E675C; line-height: 1.55;\">{{ c.cnote }}<\u002Fp>\n        <div style=\"margin-top: 16px;\"><span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; background: {{ c.cbg }}; color: {{ c.cfg }}; border: 1px solid {{ c.cbd }}; border-radius: 5px; padding: 4px 10px;\">{{ c.cbadge }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ c.showRota }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-reveal=\"\" style=\"margin-top: 20px; background: #FDFCF9; border: 1px solid #E3DDD2; border-radius: 10px; padding: 24px 26px;\">\n        <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #8A8378; margin-bottom: 16px;\">How the request flows<\u002Fdiv>\n        <div style=\"display: flex; align-items: stretch; gap: 0; flex-wrap: wrap;\">\n          <div data-flow=\"1\" style=\"flex: 1; min-width: 150px; background: #E4EBF3; border: 1px solid #C6D3E2; border-radius: 8px; padding: 12px 14px;\">\n            <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: #35597F;\">envelope<\u002Fdiv>\n            <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: #23405E; margin-top: 4px;\">org.ccdp.planning<br>min: FORMALLY_VERIFIED<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; padding: 0 10px; color: #A79C8C; font-size: 18px;\">→<\u002Fdiv>\n          <div data-flow=\"2\" style=\"flex: 1; min-width: 130px; background: #E4EBF3; border: 1px solid #C6D3E2; border-radius: 8px; padding: 12px 14px;\">\n            <div style=\"font-weight: 700; font-size: 13.5px; color: #23405E;\">Dispatcher<\u002Fdiv>\n            <div style=\"font-size: 12px; color: #35597F; margin-top: 4px;\">reads envelope only — never the rota<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; padding: 0 10px; color: #A79C8C; font-size: 18px;\">→<\u002Fdiv>\n          <div data-flow=\"3\" style=\"flex: 1; min-width: 130px; background: #D9E9E4; border: 1px solid #B5D2C9; border-radius: 8px; padding: 12px 14px;\">\n            <div style=\"font-weight: 700; font-size: 13.5px; color: #185D55;\">Constraint solver<\u002Fdiv>\n            <div style=\"font-size: 12px; color: #2A7B6C; margin-top: 4px;\">Mode 2 · deterministic<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; padding: 0 10px; color: #A79C8C; font-size: 18px;\">→<\u002Fdiv>\n          <div data-flow=\"4\" style=\"flex: 1.2; min-width: 170px; background: #FDFCF9; border: 1px solid #E3DDD2; border-radius: 8px; padding: 12px 14px;\">\n            <div style=\"font-size: 12.5px; color: #44403A; line-height: 1.5;\">A provably valid rota <span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; background: #D3E5E1; color: #0E544F; border-radius: 4px; padding: 1px 5px;\">FORMALLY_VERIFIED<\u002Fspan> — or UNSAT, or <span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; background: #F5EBD8; color: #7A5518; border-radius: 4px; padding: 1px 5px;\">ESCALATION<\u002Fspan> to a human<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ c.showDag }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-reveal=\"\" style=\"margin-top: 20px; background: #FDFCF9; border: 1px solid #E3DDD2; border-radius: 10px; padding: 24px 26px;\">\n        <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #8A8378; margin-bottom: 16px;\">The decomposition DAG<\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 0; flex-wrap: wrap;\">\n          <div data-flow=\"1\" style=\"flex: 1; min-width: 120px; background: #F1EEE7; border: 1px solid #E3DDD2; border-radius: 8px; padding: 12px 14px;\">\n            <div style=\"font-weight: 700; font-size: 13.5px; color: #44403A;\">Mixed request<\u002Fdiv>\n            <div style=\"font-size: 12px; color: #8A8378; margin-top: 3px;\">rota + email<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; padding: 0 10px; color: #A79C8C; font-size: 18px;\">→<\u002Fdiv>\n          <div data-flow=\"2\" style=\"flex: 1.1; min-width: 140px; background: #ECE7F4; border: 1px solid #D5CCE6; border-radius: 8px; padding: 12px 14px;\">\n            <div style=\"font-weight: 700; font-size: 13.5px; color: #4A3A70;\">Decomposition Service<\u002Fdiv>\n            <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: #6D5A9E; margin-top: 4px;\">plan: VALIDATED<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; padding: 0 10px; color: #A79C8C; font-size: 18px;\">→<\u002Fdiv>\n          <div style=\"flex: 1.3; min-width: 170px; display: flex; flex-direction: column; gap: 10px;\">\n            <div data-flow=\"3\" style=\"background: #D9E9E4; border: 1px solid #B5D2C9; border-radius: 8px; padding: 10px 14px;\">\n              <div style=\"font-weight: 700; font-size: 13px; color: #185D55;\">(a) Constraint solver — rota<\u002Fdiv>\n              <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: #0E544F; margin-top: 3px;\">FORMALLY_VERIFIED<\u002Fdiv>\n            <\u002Fdiv>\n            <div data-flow=\"4\" style=\"background: #EFEBE3; border: 1px solid #D8D2C6; border-radius: 8px; padding: 10px 14px;\">\n              <div style=\"font-weight: 700; font-size: 13px; color: #6E6558;\">(b) LLM — email · depends on (a)<\u002Fdiv>\n              <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: #6E6558; margin-top: 3px;\">ASSERTED<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; padding: 0 10px; color: #A79C8C; font-size: 18px;\">→<\u002Fdiv>\n          <div data-flow=\"5\" style=\"flex: 1.2; min-width: 160px; background: #FDFCF9; border: 1px solid #E3DDD2; border-radius: 8px; padding: 12px 14px;\">\n            <div style=\"font-weight: 700; font-size: 13.5px; color: #44403A;\">Composed deliverable<\u002Fdiv>\n            <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: #6E6558; margin-top: 4px;\">min() = ASSERTED<\u002Fdiv>\n            <div style=\"font-size: 11.5px; color: #6E675C; margin-top: 3px;\">composition trace preserves each part's grade<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div data-reveal=\"\" style=\"margin-top: 20px; background: #ECE7F4; border: 1px solid #D5CCE6; border-radius: 10px; padding: 16px 24px; display: flex; gap: 14px; align-items: baseline;\">\n      <span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #6D5A9E; flex-shrink: 0;\">Takeaway<\u002Fspan>\n      <span style=\"font-size: 15.5px; color: #3A2E58; line-height: 1.6;\">{{ c.takeaway }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-for>\n\n<!-- ============ 17 · DEPLOYMENT ============ -->\n<section data-view=\"16\" data-screen-label=\"Example Deployment\" style=\"max-width: 1000px; margin: 0 auto; padding: 88px 48px; border-top: 1px solid #E3DDD2;\">\n  <div data-reveal=\"\" style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .2em; color: #8A8378; text-transform: uppercase;\">View 17 · In practice<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 42px; margin: 14px 0 6px;\">An enterprise deployment<\u002Fh2>\n  <p data-reveal=\"\" style=\"color: #6E675C; max-width: 680px; margin: 0 0 30px;\">A company deploys CCDP for mixed cognitive workloads — legal analysis, code generation, data retrieval, planning. One Dispatcher, one PostgreSQL-backed Registry, the compliance team as Human Supervisor behind a review queue, and seven Services.<\u002Fp>\n  <div data-reveal=\"\" style=\"background: #FDFCF9; border: 1px solid #E3DDD2; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(35,32,26,.05);\">\n    <div style=\"display: grid; grid-template-columns: 1.3fr .55fr 1.5fr 1fr .8fr; gap: 0; padding: 12px 22px; background: #F1EEE7; border-bottom: 1px solid #E3DDD2; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #8A8378;\">\n      <div>Service<\u002Fdiv><div>Mode<\u002Fdiv><div>Capability type<\u002Fdiv><div>Typical grade<\u002Fdiv><div style=\"text-align: right;\">Cost<\u002Fdiv>\n    <\u002Fdiv>\n    <sc-for list=\"{{ deployment }}\" as=\"d\" hint-placeholder-count=\"7\">\n      <div style=\"display: grid; grid-template-columns: 1.3fr .55fr 1.5fr 1fr .8fr; gap: 0; padding: 12px 22px; border-bottom: 1px solid #EFEBE3; align-items: center;\">\n        <div style=\"font-weight: 700; font-size: 14px; color: #23201A;\">{{ d.name }}<\u002Fdiv>\n        <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: {{ d.mfg }};\">{{ d.mode }}<\u002Fdiv>\n        <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: #6E675C;\">{{ d.cap }}<\u002Fdiv>\n        <div><span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; font-weight: 700; background: {{ d.gbg }}; color: {{ d.gfg }}; border-radius: 4px; padding: 2px 7px;\">{{ d.grade }}<\u002Fspan><\u002Fdiv>\n        <div style=\"text-align: right; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #7A5518;\">{{ d.cost }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div data-reveal=\"\" style=\"margin-top: 26px; background: #FDFCF9; border: 1px solid #E3DDD2; border-radius: 10px; padding: 24px 28px;\">\n    <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #35597F; margin-bottom: 6px;\">Request flow<\u002Fdiv>\n    <p style=\"margin: 0 0 16px; font-style: italic; color: #44403A;\">“Generate a legally compliant privacy policy for our new product.”<\u002Fp>\n    <div style=\"display: flex; flex-direction: column; gap: 9px;\">\n      <sc-for list=\"{{ flowSteps }}\" as=\"f\" hint-placeholder-count=\"7\">\n        <div data-flow=\"{{ f.n }}\" style=\"display: flex; gap: 14px; align-items: baseline;\">\n          <span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #8A8378; flex-shrink: 0; width: 16px;\">{{ f.n }}<\u002Fspan>\n          <span style=\"font-size: 14.5px; color: #44403A; line-height: 1.55;\">{{ f.text }}<\u002Fspan>\n          <sc-if value=\"{{ f.hasGrade }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; font-weight: 700; background: {{ f.gbg }}; color: {{ f.gfg }}; border-radius: 4px; padding: 2px 7px; flex-shrink: 0;\">{{ f.grade }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin: 18px 0 0; font-size: 14px; color: #6E675C; line-height: 1.6;\">Composed result: <span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 12px;\">min(VALIDATED, COMPUTED, ASSERTED, HUMAN_ATTESTED) = ASSERTED<\u002Fspan> — but the legal compliance check is separately tracked at HUMAN_ATTESTED. The consumer inspects the composition trace to see which parts to trust.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 18 · WHY NOT JUST…? ============ -->\n<section data-view=\"17\" data-screen-label=\"Why Not Just…?\" style=\"max-width: 1000px; margin: 0 auto; padding: 88px 48px; border-top: 1px solid #E3DDD2;\">\n  <div data-reveal=\"\" style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .2em; color: #8A8378; text-transform: uppercase;\">View 18 · Prior art<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 42px; margin: 14px 0 6px;\">Why not just use…?<\u002Fh2>\n  <p data-reveal=\"\" style=\"color: #6E675C; max-width: 640px; margin: 0 0 30px;\">Existing protocols each get something right — none carries the epistemic dimension.<\u002Fp>\n  <div data-reveal=\"\" style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 18px;\">\n    <sc-for list=\"{{ protocols }}\" as=\"p\" hint-placeholder-count=\"4\">\n      <div style=\"background: #FDFCF9; border: 1px solid #E3DDD2; border-radius: 10px; padding: 24px 26px; box-shadow: 0 1px 3px rgba(35,32,26,.05);\">\n        <div style=\"font-family: ui-monospace, Menlo, monospace; font-weight: 700; font-size: 16px; color: #23201A; margin-bottom: 14px;\">{{ p.name }}<\u002Fdiv>\n        <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #2A7B6C;\">Gets right<\u002Fdiv>\n        <p style=\"margin: 5px 0 14px; font-size: 14px; color: #44403A; line-height: 1.6;\">{{ p.right }}<\u002Fp>\n        <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #A64B37;\">Lacks<\u002Fdiv>\n        <p style=\"margin: 5px 0 0; font-size: 14px; color: #44403A; line-height: 1.6;\">{{ p.lacks }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ 19 · CLOSING ============ -->\n<section data-view=\"18\" data-screen-label=\"Closing\" style=\"max-width: 900px; margin: 0 auto; padding: 88px 48px 130px; border-top: 1px solid #E3DDD2;\">\n  <div data-reveal=\"\" style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .2em; color: #8A8378; text-transform: uppercase;\">View 19 · The deeper lineage<\u002Fdiv>\n  <h2 data-reveal=\"\" style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 42px; margin: 14px 0 6px;\">It's a supervision tree<\u002Fh2>\n  <p data-reveal=\"\" style=\"color: #6E675C; max-width: 680px; margin: 0 0 28px;\">CCDP maps to the classic OTP supervision-tree model — the architecture behind telecom systems with nine nines of uptime.<\u002Fp>\n  <div data-reveal=\"\" style=\"display: flex; flex-direction: column; gap: 10px;\">\n    <sc-for list=\"{{ otp }}\" as=\"o\" hint-placeholder-count=\"4\">\n      <div style=\"display: grid; grid-template-columns: 190px 1fr; gap: 18px; background: #FDFCF9; border: 1px solid #E3DDD2; border-radius: 9px; padding: 14px 22px; align-items: baseline;\">\n        <div style=\"font-weight: 700; font-size: 15px; color: {{ o.fg }};\">{{ o.ccdp }}<\u002Fdiv>\n        <div style=\"font-size: 14.5px; color: #44403A; line-height: 1.6;\"><span style=\"font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #8A8378;\">= {{ o.otp }}<\u002Fspan> — {{ o.desc }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div data-reveal=\"\" style=\"margin-top: 26px; background: #ECE7F4; border: 1px solid #D5CCE6; border-radius: 10px; padding: 22px 28px;\">\n    <p style=\"margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; font-weight: 500; font-style: italic; color: #3A2E58; line-height: 1.5;\">You build reliable systems from unreliable components not by making the components correct, but by strong isolation, message-passing-only interaction, supervision, and restart from a known-good state.<\u002Fp>\n    <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; color: #6D5A9E; margin-top: 10px;\">— Armstrong, 2003<\u002Fdiv>\n  <\u002Fdiv>\n  <div data-reveal=\"\" style=\"margin-top: 40px;\">\n    <div style=\"font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .2em; color: #8A8378; text-transform: uppercase; margin-bottom: 16px;\">Quick reference<\u002Fdiv>\n    <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;\">\n      <sc-for list=\"{{ numbers }}\" as=\"n\" hint-placeholder-count=\"8\">\n        <div style=\"background: #FDFCF9; border: 1px solid #E3DDD2; border-radius: 9px; padding: 16px 18px; text-align: center;\">\n          <div style=\"font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700; font-size: 38px; color: {{ n.fg }}; line-height: 1;\">{{ n.big }}<\u002Fdiv>\n          <div style=\"font-size: 12.5px; color: #6E675C; margin-top: 6px; line-height: 1.4;\">{{ n.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p data-reveal=\"\" style=\"margin-top: 44px; text-align: center; font-size: 15.5px; color: #6E675C;\">Want the full detail? Read the <a href=\"https://github.com/billosys/ai-engineering/blob/main/protocols/ccdp/composite-cognition-dispatch-protocol.md\" target=\"_blank\" rel=\"noopener\">CCDP v0.2 specification<\u002Fa>.<\u002Fp>\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showProgressRail&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Navigation&quot;},&quot;animateDiagrams&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}\">\nclass Component extends DCLogic {\n  state = { active: 0, comp: 'dispatcher', layer: 3, grade: null };\n\n  componentDidMount() {\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    els.forEach(el => { el.style.opacity = '0'; el.style.transform = 'translateY(14px)'; el.style.transition = 'opacity .7s ease, transform .7s ease'; });\n    this._ro = new IntersectionObserver(entries => {\n      entries.forEach(e => { if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'none'; this._ro.unobserve(e.target); } });\n    }, { threshold: 0.12 });\n    els.forEach(el => this._ro.observe(el));\n\n    this._so = new IntersectionObserver(entries => {\n      entries.forEach(e => { if (e.isIntersecting) this.setState({ active: parseInt(e.target.getAttribute('data-view'), 10) }); });\n    }, { rootMargin: '-40% 0px -55% 0px' });\n    document.querySelectorAll('section[data-view]').forEach(s => this._so.observe(s));\n\n    if (this.props.animateDiagrams ?? true) {\n      document.querySelectorAll('[data-flow]').forEach(el => {\n        const n = parseInt(el.getAttribute('data-flow'), 10) || 1;\n        el.style.animation = 'ccdpFlow 5s ease-in-out ' + ((n - 1) * 0.6) + 's infinite';\n      });\n    }\n  }\n  componentWillUnmount() { this._ro && this._ro.disconnect(); this._so && this._so.disconnect(); }\n\n  renderVals() {\n    const g = {\n      unb: { bg: '#EFEBE3', fg: '#6E6558', bd: '#D8D2C6' },\n      mach: { bg: '#D9E9E4', fg: '#185D55', bd: '#B5D2C9' },\n      hum: { bg: '#F8E7E0', fg: '#A64B37', bd: '#E5C0B4' },\n      esc: { bg: '#F5EBD8', fg: '#7A5518', bd: '#E4D2AC' },\n      proto: { bg: '#E4EBF3', fg: '#23405E', bd: '#C6D3E2' },\n      epi: { bg: '#ECE7F4', fg: '#4A3A70', bd: '#D5CCE6' }\n    };\n    const labels = ['Hero', 'The Core Problem', 'Component Diagram', 'Protocol Layers', 'Grade Ladder', 'Compare: Intro', 'Claims vs Data', 'Routing', 'The Trust Ladder', 'Escalation', 'Decomposition', 'Audit Trail', 'Capability Registry', 'Flow Control', 'Security', 'Service Modes', 'Example Deployment', 'Why Not Just…?', 'Closing'];\n    const navDots = labels.map((label, i) => ({\n      label: (i + 1) + ' · ' + label,\n      bg: i === this.state.active ? '#35597F' : '#E3DDD2',\n      bd: i === this.state.active ? '#35597F' : '#C9C2B4',\n      go: () => { const el = document.querySelector('section[data-view=\"' + i + '\"]'); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 20, behavior: 'smooth' }); }\n    }));\n\n    const components = {\n      supervisor: { name: 'Human Supervisor', accent: '#A64B37', desc: 'Sits at the top of the supervision tree. Provides specification, value judgment, and the faculties no machine has yet. The escalation chain terminates here. Provenance grade when a human signs off: HUMAN_ATTESTED — the ceiling.' },\n      dispatcher: { name: 'Dispatcher', accent: '#35597F', desc: 'The constrained coordinator at the center of the star. Reads envelopes, never content. Routes requests, enforces schemas, logs audits, monitors health, enforces deadlines, handles escalation. It is deliberately not intelligent — a protocol enforcement engine, like a network switch that reads headers and forwards packets.' },\n      registry: { name: 'Capability Registry', accent: '#35597F', desc: 'The source of truth for what Services exist, what they can do (typed contracts with JSON Schemas for input/output), their cost hints, health endpoints, provenance capabilities, and schema versions. The Dispatcher consults it for every routing decision.' },\n      m1: { name: 'Mode 1 — LLM alone', accent: '#6E6558', desc: 'Language generation, summarization, translation. Typical grade: ASSERTED or HEURISTIC. The language organ — superb at understanding and generation, structurally unreliable at deduction or planning without external checks.' },\n      m2: { name: 'Mode 2 — Deterministic engine', accent: '#2A7B6C', desc: 'Theorem provers (Z3, Lean, Coq), planners, databases, calculators. Typical grade: COMPUTED bd: '#B9A9DB', what: 'Provenance grades and evidence, escalation semantics, decomposition plans, cost and resource signals. The layer that carries \\u201chow much should you trust this answer\\u201d as a first-class protocol field.' },\n      { n: 2, name: 'Routing & Audit', analog: 'Internet / Network', fg: '#23405E', bg: '#E4EBF3', bd: '#C6D3E2', what: 'Capability-type routing, registry lookups, trace/span IDs, mandatory audit, deadline propagation, health monitoring.' },\n      { n: 1, name: 'Transport', analog: 'TCP/IP Transport + Link', fg: '#44403A', bg: '#FDFCF9', bd: '#E3DDD2', what: 'HTTP, JSON-RPC 2.0, TLS, authentication (mTLS, bearer tokens).' }\n    ].map(ly => ({ ...ly, open: this.state.layer === ly.n, go: () => this.setState({ layer: this.state.layer === ly.n ? null : ly.n }), shadow: ly.n === 3 ? '0 0 0 3px rgba(109,90,158,.14), 0 2px 10px rgba(109,90,158,.18)' : '0 1px 2px rgba(35,32,26,.04)' }));\n\n    const gradeData = [\n      { n: 7, name: 'HUMAN_ATTESTED', cat: 'Human judgment', line: 'A person reviewed and signed off.', detail: 'The ceiling. Domain expert with verified identity. Highest grade because the spec-recursion problem terminates at human judgment — someone must decide whether the specification captures intent.', bar: '#C05C46', ...g.hum },\n      { n: 6, name: 'FORMALLY_VERIFIED', cat: 'Machine-verified', line: 'Proven correct against a stated spec.', detail: 'Machine-checkable proof available (Lean, Coq, Z3). Carries a scope field binding it to a specific specification. The spec-recursion caveat: \\u201ccorrect relative to this spec\\u201d — whether the spec captures intent is a separate question.', bar: '#16695F', bg: '#D3E5E1', fg: '#0E544F', bd: '#B0CFC9' },\n      { n: 5, name: 'CROSS_CHECKED', cat: 'Machine-verified', line: 'Independent services agree on the result.', detail: 'Multiple different methods, different implementations, no shared state. Full independence required (not replicas). Agreement across independent processes s not a best practice — it\\u2019s a protocol requirement. Every hop, every decision, every grade, logged in a structured, query-friendly format.'),\n      C(13, 'Capability registry', 'Typed Contracts', 'I need to add a new theorem-proving service to my system.',\n        ['Write a natural-language tool description: \\u201cThis tool proves theorems.\\u201d', 'The LLM reads the description and decides when to invoke it.', 'No schema versioning. No compatibility checking. If the tool\\u2019s API changes, things break silently.'],\n        'Tool descriptions are free text meant for LLM consumption. The protocol intelligence lives in the consumer, not the envelope.', badge('free-text description', g.unb),\n        ['Register a Capability Record: service_id, capability_type (org.ccdp.deduction), input and output JSON Schemas, cost hints (p50/p95/p99 latency, monetary cost), provenance capabilities (max_grade: FORMALLY_VERIFIED), health-check endpoint, schema version with Avro-style compatibility rules.', 'The Registry enforces backward/forward compatibility on schema evolution.', 'The Dispatcher routes by typed metadata, not by reading descriptions.'],\n        'Typed contracts with versioned schemas. The service can evolve without breaking consumers — the Registry enforces it.', badge('typed contract \\u00b7 versioned', g.proto),\n        'Typed contracts in a registry with schema versioning, not free-text descriptions interpreted by an LLM.'),\n      C(14, 'Flow control', 'Resource Signals', 'Analyze this dataset, but don\\u2019t spend more than $5 and finish within 10 minutes.',\n        ['No native cost signals. You might hit a token limit, or the API might time out.', 'No way to express \\u201cI want an answer, but not at any price.\\u201d', 'If you hit the ceiling, you get an error, not a graceful degradation.'],\n        'Cost and deadline are infrastructure concerns, not protocol features.', badge('no cost signals', g.unb),\n        ['Request carries cost_budget: {max_monetary_cost: \\u201c5.00\\u201d, USD} and a deadline with 10 minutes remaining.', 'Dispatcher filters services by estimated latency (p95) and cost hints. Routes to the best candidate that can plausibly finish in budget.', 'A service about to exceed the budget returns ESCALATION with reason BUDGET_EXCEEDED, reporting resources consumed so far and an estimate of what\\u2019s needed.', 'Every response reports actual consumption: tokens, compute seconds, monetary cost. Audit data enables increasingly accurate cost estimation over time.'],\n        'Cost budgets and deadlines are protocol-level fields, not afterthoughts. The Dispatcher makes resource-rational routing decisions.', badge('cost_budget \\u00b7 deadline', g.esc),\n        'TCP has congestion signals. A cognitive dispatch protocol needs cognitive-resource signals. CCDP has them.'),\n      C(15, 'Security', 'Protocol vs Discipline', 'Ensure that only authorized users can invoke the legal analysis service.',\n        ['Security depends on implementation discipline: each tool author implements their own auth, each host manages its own token validation.', 'Tool naming collisions exploitable from public registries.', 'No mandated mutual authentication between components.'],\n        'Security by convention — it works until it doesn\\u2019t.', badge('by convention', g.unb),\n        ['mTLS between Dispatcher and every Service — mutual authentication at the transport layer, no impersonation.', 'Bearer tokens with capability-type scoping: a token authorized for org.ccdp.language.generation is rejected for org.ccdp.deduction.', 'Ed25519 or HMAC-SHA256 envelope signing for high-grade provenance and cross-domain deployments.', 'Replay protection: same request_id with a different payload is rejected (error -32011). Every security decision is logged in the audit trail.'],\n        'Security by protocol guarantee, not by implementation discipline.', badge('mTLS \\u00b7 scoped tokens', g.proto),\n        'A cognitive dispatch protocol with security as a protocol guarantee, not an implementation choice.'),\n      C(16, 'Service modes', 'Progressive Automation', 'How do I bring a new cognitive capability online?',\n        ['Train a bigger model. Hope it handles the new task.', 'Or add a tool and hope the LLM knows when to use it.', 'No structured path from \\u201ca human does this\\u201d to \\u201ca machine does this.\\u201d'],\n        'Scaling means bigger models, not more capable systems.', badge('bigger model', g.unb),\n        ['Start with Mode 4: a human does the task behind a typed interface — same envelope, same schema, same provenance, just slower and more expensive.', 'When tooling matures, swap in Mode 3: LLM + deterministic engine. The Dispatcher doesn\\u2019t change. The Registry schemas don\\u2019t change. Other services\\u2019 integrations don\\u2019t change.', 'Later, swap in Mode 2: deterministic engine alone. Same interface, higher provenance grade, lower cost.', 'Provenance grades make the swap transparent: consumers see the grade change from HUMAN_ATTESTED to FORMALLY_VERIFIED and calibrate trust accordingly.'],\n        'Progressive automation: start with humans everywhere, replace one service at a time. The protocol is the stable spine.', badge('Mode 4 \\u2192 3 \\u2192 2', g.epi),\n        'Modes are interchangeable without changing the Dispatcher. The path from \\u201ca human does this\\u201d to \\u201ca machine does this\\u201d is a service swap, not a protocol rewrite.')\n    ];\n    compares[9].reqLabel = 'Concept';\n\n    const deployment = [\n      { name: 'Claude (LLM)', mode: 'M1', mfg: g.unb.fg, cap: 'org.ccdp.language.generation \\u00b7 .translation', grade: 'ASSERTED', gbg: g.unb.bg, gfg: g.unb.fg, cost: '$0.01\\u20130.50/req' },\n      { name: 'Z3 Prover', mode: 'M2', mfg: g.mach.fg, cap: 'org.ccdp.deduction', grade: 'FORMALLY_VERIFIED', gbg: '#D3E5E1', gfg: '#0E544F', cost: '$0.001/req' },\n      { name: 'OptaPlanner', mode: 'M2', mfg: g.mach
